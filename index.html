<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой сайт</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet"></p>
<p><style>
body {
  margin: 0;
  font-family: &lsquo;Inter&rsquo;, sans-serif;
  background: linear-gradient (135 deg, #0f172a, #1e293b);
  color: white;
}</p>
<p>.animate {
  opacity: 0;
  transform: translateY (40 px);
  transition: all 1.5 s ease;
}</p>
<p>.animate.show {
  opacity: 1;
  transform: translateY (0);
}</p>
<p>header {
  text-align: center;
  padding: 100px 20px;
}</p>
<p>.section {
  padding: 80px 20px;
  text-align: center;
}</p>
<p>.button {
  display: inline-block;
  margin-top: 20 px;
  padding: 12 px 25 px;
  background: #22c55e;
  color: white;
  text-decoration: none;
  border-radius: 10 px;
}
</style>
</head></p>
<p><body></p>
<header class="animate">
<h1>Создаю современные сайты</h1>
<p>Красиво и быстро</p>
<a class="button" href="#contact">Связаться</a>
</header>
<section class="section animate">
<h2>Обо мне</h2>
<p>Я делаю сайты, которые выглядят современно и привлекают клиентов</p>
</section>
<section class="section animate">
<h2>Услуги</h2>
<p>Лендинг / сайт-визитка / редизайн</p>
</section>
<section class="section animate" id="contact">
<h2>Контакты</h2>
<p>Telegram: @yourname</p>
</section>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const elements = document.querySelectorAll('.animate');
  elements.forEach((el, index) => {
    setTimeout(() => {
      el.classList.add('show');
    }, index * 800);
  });
});
</script>
<p></body>
</html>
