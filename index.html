<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Фильмы</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet"></p>
<p><style>
body {
  margin: 0;
  font-family: &lsquo;Inter&rsquo;, sans-serif;
  background: #0f172a;
  color: white;
}</p>
<p>header {
  text-align: center;
  padding: 40px 20px;
  background: #020617;
}</p>
<p>h1 {
  margin: 0;
}</p>
<p>.container {
  padding: 40px;
}</p>
<p>.movies {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  justify-content: center;
}</p>
<p>.movie {
  width: 200px;
  background: #1e293b;
  border-radius: 12px;
  overflow: hidden;
  transition: 0.3s;
}</p>
<p>.movie:hover {
  transform: scale(1.05);
}</p>
<p>.movie img {
  width: 100%;
}</p>
<p>.movie-info {
  padding: 15px;
}</p>
<p>.movie-info h3 {
  margin: 0 0 10px;
}</p>
<p>.search {
  text-align: center;
  margin-bottom: 30px;
}</p>
<p>input {
  padding: 10px;
  width: 250px;
  border-radius: 8px;
  border: none;
}
</style>
</head></p>
<p><body></p>
<header>
<h1>🎬 Мой кино-сайт</h1>
</header>
<div class="container">
<div class="search">
<input type="text" id="search" placeholder="Поиск фильма...">
</div>
<div class="movies" id="movies"></div>
<p></div></p>
<script>
const movies = [
  {
    title: "Интерстеллар",
    year: "2014",
    img: "https://image.tmdb.org/t/p/w500/nCbkOyOMTEwlEV0LtCOvCnwEONA.jpg"
  },
  {
    title: "Джокер",
    year: "2019",
    img: "https://image.tmdb.org/t/p/w500/udDclJoHjfjb8Ekgsd4FDteOkCU.jpg"
  },
  {
    title: "Матрица",
    year: "1999",
    img: "https://image.tmdb.org/t/p/w500/aoiU9L9V2V7KX1u4E6YH4kE4x8w.jpg"
  }
];
const moviesEl = document.getElementById('movies');
function showMovies(list) {
  moviesEl.innerHTML = "";
  list.forEach(movie => {
    const div = document.createElement('div');
    div.classList.add('movie');
    div.innerHTML = `
      <img src="${movie.img}">
      <div class="movie-info">
        <h3>${movie.title}</h3>
        <p>${movie.year}</p>
      </div>
    `;
    moviesEl.appendChild(div);
  });
}
showMovies(movies);
// поиск
const search = document.getElementById('search');
search.addEventListener('input', (e) => {
  const value = e.target.value.toLowerCase();
  const filtered = movies.filter(m => m.title.toLowerCase().includes(value));
  showMovies(filtered);
});
</script>
<p></body>
</html>
